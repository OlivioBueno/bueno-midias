<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Universidade Bilíngue</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style id="login-style">
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body.login { background: linear-gradient(135deg, #1F4E78, #2E86AB); min-height: 100vh;
    display: flex; align-items: center; justify-content: center; color: #1F2937; padding: 16px; }
  .login-box { background: white; padding: 36px 28px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.25);
    width: 100%; max-width: 380px; text-align: center; }
  .login-box h1 { margin: 0 0 6px 0; font-size: 20px; color: #1F4E78; letter-spacing: -0.01em; }
  .login-box p { margin: 0 0 24px 0; color: #6B7280; font-size: 14px; }
  .login-box input { width: 100%; padding: 12px 14px; border: 2px solid #E5E7EB; border-radius: 10px;
    font-size: 16px; margin-bottom: 14px; outline: none; transition: border-color 0.2s; }
  .login-box input:focus { border-color: #2E86AB; }
  .login-box button { width: 100%; padding: 12px; background: #1F4E78; color: white; border: none;
    border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
  .login-box button:hover { background: #2E86AB; }
  .login-box button:disabled { background: #9CA3AF; cursor: not-allowed; }
  .login-msg { font-size: 13px; margin-top: 8px; min-height: 18px; }
  .login-msg.err { color: #C0392B; }
  .login-msg.ld { color: #6B7280; }
</style>
</head>
<body class="login">

<div id="login" class="login-box">
  <h1>Dashboard Universidade Bilíngue</h1>
  <p>Área restrita. Digite a senha de acesso.</p>
  <form id="loginForm" autocomplete="off">
    <input type="password" id="pwd" placeholder="Senha" autofocus>
    <button type="submit" id="btn">Acessar</button>
    <div class="login-msg" id="msg"></div>
  </form>
</div>

function b64decode(s) {
  const bin = atob(s); const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return buf;
}
async function deriveKey(password, salt, iter) {
  const enc = new TextEncoder();
  const mat = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt: salt, iterations: iter, hash:'SHA-256'},
    mat, {name:'AES-GCM', length: 256}, false, ['decrypt']
  );
}
async function decrypt(password) {
  const salt = b64decode(PAYLOAD.salt);
  const iv = b64decode(PAYLOAD.iv);
  const ct = b64decode(PAYLOAD.ct);
  const key = await deriveKey(password, salt, PAYLOAD.iter);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv: iv}, key, ct);
  return new TextDecoder().decode(plain);
}
function executeScripts(container) {
  const scripts = container.querySelectorAll('script');
  scripts.forEach(old => {
    const s = document.createElement('script');
    for (const attr of old.attributes) s.setAttribute(attr.name, attr.value);
    if (!old.src) s.textContent = old.textContent;
    old.parentNode.replaceChild(s, old);
  });
}

function uniCpaColor(v) {
  if (v === null || v === undefined || isNaN(v)) return '#f9fafb';
  if (v < 110) return '#C6EFCE';
  if (v <= 150) return '#FFEB9C';
  if (v <= 190) return '#FCD5B4';
  if (v <= 250) return '#F8CBAD';
  if (v <= 350) return '#F4B084';
  return '#E26B0A';
}

function uniKpiCard(label, value, color, isBad) {
  var topColor = isBad ? '#ef4444' : color;
  return '<div style="background:#fff;border:1px solid #e2e8f0;border-top:3px solid ' + topColor + ';border-radius:8px;padding:16px 14px;text-align:center;">' +
    '<div style="font-size:10px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;">' + label + '</div>' +
    '<div style="font-size:22px;font-weight:800;color:#111827;">' + value + '</div></div>';
}

function uniTh(txt) { return '<th style="background:#1e293b;color:#f1f5f9;padding:10px 12px;text-align:left;font-size:13px;font-weight:600;white-space:nowrap;border-right:1px solid #334155;">' + txt + '</th>'; }
function uniTd(txt, extra) { return '<td style="padding:9px 12px;font-size:13px;color:#111827;border-bottom:1px solid #e5e7eb;' + (extra||'') + '">' + txt + '</td>'; }

function uniTableWrap(cols, rows) {
  var s = '<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;">';
  s += '<thead><tr>' + cols.map(uniTh).join('') + '</tr></thead><tbody>';
  s += rows.join('');
  s += '</tbody></table></div>';
  return s;
}

function uniMainTab(btn) { var tab = btn.getAttribute("data-uni-main");
  document.querySelectorAll('[data-uni-main]').forEach(function(b) {
    var isActive = b.getAttribute('data-uni-main') === tab;
    b.style.color = isActive ? '#111827' : '#6b7280';
    b.style.borderBottom = isActive ? '3px solid #111827' : '3px solid transparent';
  });
  ['lead','trafego'].forEach(function(t) {
    var el = document.getElementById('uni-pnl-' + t);
    if (el) el.style.display = t === tab ? 'block' : 'none';
  });
}

function uniSubTab(btn) { var tab = btn.getAttribute("data-uni-sub");
  document.querySelectorAll('[data-uni-sub]').forEach(function(b) {
    var isActive = b.getAttribute('data-uni-sub') === tab;
    b.style.background = isActive ? '#3b82f6' : '#f9fafb';
    b.style.color = isActive ? '#fff' : '#374151'; b.style.borderColor = isActive ? '#1e293b' : '#e5e7eb';
  });
  ['resumo','horarios','dias','calor','publico','tendencia','plano','projecao','checklist'].forEach(function(t) {
    var el = document.getElementById('uni-sub-' + t);
    if (el) el.style.display = t === tab ? 'block' : 'none';
  });
}

function injectTabs() {
  var cDiv = document.getElementById('content');
  if (!cDiv || document.getElementById('tabs-uni')) return;
  var subtitleEl = null;
  var tw = document.createTreeWalker(cDiv, NodeFilter.SHOW_TEXT);
  var n;
  while ((n = tw.nextNode())) {
    if (n.textContent.indexOf('Insights da pesquisa e compras') >= 0) {
      subtitleEl = n.parentElement;
      break;
    }
  }
  if (!subtitleEl) return;
  var anchor = subtitleEl;
  for (var i = 0; i < 8; i++) {
    var par = anchor.parentElement;
    if (!par || par === cDiv) break;
    if (par.tagName === 'DIV' || par.tagName === 'SECTION' || par.tagName === 'MAIN') {
      anchor = par;
    } else {
      break;
    }
  }
  var w = document.createElement('div');
  w.id = 'tabs-uni';
  w.innerHTML = uniGetTabsHTML();
  if (anchor.nextSibling) {
    anchor.parentNode.insertBefore(w, anchor.nextSibling);
  } else {
    anchor.parentNode.appendChild(w);
  }
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pwd = document.getElementById('pwd').value;
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btn');
  msg.className = 'login-msg ld';
  msg.textContent = 'Verificando...';
  btn.disabled = true;
  try {
    const plain = await decrypt(pwd);
    const payload = JSON.parse(plain);
    document.body.classList.remove('login');
    document.getElementById('login').remove();
    const ls = document.getElementById('login-style');
    if (ls) ls.remove();
    const styleTag = document.createElement('style');
    styleTag.textContent = payload.styles;
    document.head.appendChild(styleTag);
    const content = document.getElementById('content');
    content.innerHTML = payload.body;
    content.style.display = '';
    executeScripts(content);
    injectTabs();
  } catch (ex) {
    msg.className = 'login-msg err';
    msg.textContent = 'Senha incorreta. Tente novamente.';
    btn.disabled = false;
    document.getElementById('pwd').value = '';
    document.getElementById('pwd').focus();
  }
});
